services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wrestling-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wrestlingdb123}
      POSTGRES_DB: wrestling_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wrestling-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wrestling-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wrestling-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrestling-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wrestling_manager
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-wrestlingdb123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_another_secure_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wrestling-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wrestling-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wrestling-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wrestling-network:
    driver: bridge
